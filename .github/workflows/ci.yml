name: Node.js CI

on:
  push:
    branches: [main, "fix/**", "improve/**", "arena/**", "devin/**"]
  pull_request:
    branches: [main, "devin/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mining_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: mining_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mining_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run build
      - name: Run test suite
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -aA 14 -E "not ok|✖" /tmp/test.log | head -n 80 | tr '\n' '|' | cut -c1-60000)
            echo "::error title=Tests failed::$summary"
          fi
          exit $status
      - name: Verify API and transactions against PostgreSQL
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://mining_test:local_test_only@localhost:5432/mining_test
      - name: Trial smoke — auth, save/restore across restart, WebSocket handshake
        run: node scripts/trial-smoke.cjs
      - name: Verify WebSocket race protocol against PostgreSQL
        run: node --test test/multiplayer.test.js
        env:
          TEST_RACE_DATABASE_URL: postgres://mining_test:local_test_only@localhost:5432/mining_test
      # يعمل حتى لو فشلت اختبارات الوحدة أعلاه: E2E إشارة مستقلة، وبدون هذا يظهر
      # ERR_CONNECTION_REFUSED في كل مجموعات E2E ويخفي الفشل الحقيقي.
      - name: Install Chromium for platform browser tests
        if: ${{ !cancelled() }}
        run: npx playwright-core install --with-deps chromium
      - name: Start local app for browser tests
        if: ${{ !cancelled() }}
        run: |
          PORT=3000 HOST=127.0.0.1 ALLOW_GUEST_AUTH=true BOT_MODE=off npm start > /tmp/platform-server.log 2>&1 &
          echo $! > /tmp/platform-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/platform-server.log
          exit 1
      - name: Run first-run coach browser end-to-end test
        if: ${{ !cancelled() }}
        run: bash scripts/ci-run-e2e.sh "Coach E2E" test:coach
        env:
          TEST_APP_URL: http://127.0.0.1:3000
      - name: Run platform browser end-to-end tests
        if: ${{ !cancelled() }}
        run: bash scripts/ci-run-e2e.sh "Platform E2E" test:browser
        env:
          TEST_APP_URL: http://127.0.0.1:3000
      - name: Run mining-screen (clicker) browser end-to-end test
        if: ${{ !cancelled() }}
        run: bash scripts/ci-run-e2e.sh "Clicker E2E" test:clicker
        env:
          TEST_APP_URL: http://127.0.0.1:3000
      - name: Run deep-dive browser end-to-end test
        if: ${{ !cancelled() }}
        run: bash scripts/ci-run-e2e.sh "Deep-dive E2E" test:deepdive
        env:
          TEST_APP_URL: http://127.0.0.1:3000
      - name: Run worlds-and-bosses browser end-to-end test
        if: ${{ !cancelled() }}
        run: bash scripts/ci-run-e2e.sh "Worlds-and-bosses E2E" test:bosses
        env:
          TEST_APP_URL: http://127.0.0.1:3000
      - name: Run guide browser end-to-end test
        if: ${{ !cancelled() }}
        run: bash scripts/ci-run-e2e.sh "Guide E2E" test:guide
        env:
          TEST_APP_URL: http://127.0.0.1:3000
      - name: Run classic-mode browser end-to-end test
        if: ${{ !cancelled() }}
        run: bash scripts/ci-run-e2e.sh "Classic-mode E2E" test:classic
        env:
          TEST_APP_URL: http://127.0.0.1:3000
      - name: Run adventure-quests browser end-to-end test
        if: ${{ !cancelled() }}
        run: bash scripts/ci-run-e2e.sh "Quests E2E" test:quests
        env:
          TEST_APP_URL: http://127.0.0.1:3000
      - name: Run prestige browser end-to-end test
        if: ${{ !cancelled() }}
        run: bash scripts/ci-run-e2e.sh "Prestige E2E" test:prestige
        env:
          TEST_APP_URL: http://127.0.0.1:3000
