name: Node.js CI

on:
  push:
    branches: [main, "fix/**", "improve/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mining_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: mining_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mining_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run build
      - name: Run test suite
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -aA 14 -E "not ok|✖" /tmp/test.log | head -n 80 | tr '\n' '|' | cut -c1-60000)
            echo "::error title=Tests failed::$summary"
          fi
          exit $status
      - name: Verify API and transactions against PostgreSQL
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://mining_test:local_test_only@localhost:5432/mining_test
      - name: Verify WebSocket race protocol against PostgreSQL
        run: node --test test/multiplayer.test.js
        env:
          TEST_RACE_DATABASE_URL: postgres://mining_test:local_test_only@localhost:5432/mining_test
