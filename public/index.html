      <div class="mine-controls" role="group" aria-label="تحكم منجم المنصّة">
        <!-- Virtual Joystick (Mobile Only) -->
        <div id="virtual-joystick" class="virtual-joystick" aria-label="عصا تحكم للحركة">
          <div class="joystick-base"></div>
          <div class="joystick-handle"></div>
        </div>

        <!-- Action Buttons (Bottom Right) -->
        <div class="mine-controls-actions">
          <button id="platform-pause" type="button" aria-label="إيقاف مؤقت" class="action-btn pause-btn">⏸</button>
          <button type="button" data-platform-input="1" aria-label="تحرك يسار" class="action-btn move-btn"><b>◀</b><span>يسار</span></button>
          <button type="button" data-platform-input="2" aria-label="تحرك يمين" class="action-btn move-btn"><b>▶</b><span>يمين</span></button>
          <button type="button" data-platform-input="4" aria-label="قفز" class="action-btn jump-btn"><b>⤒</b><span>قفز</span></button>
          <button type="button" data-platform-input="8" aria-label="تعدين" class="action-btn mine-btn"><b>⛏</b><span>حفر</span></button>
          <button type="button" data-platform-input="16" aria-label="هجوم" class="action-btn attack-btn"><b>⚔️</b><span>ضرب</span></button>
          <button type="button" data-platform-input="32" aria-label="مهارة" class="action-btn skill-btn"><b>💥</b><span>قوة</span></button>
        </div>
      </div>
